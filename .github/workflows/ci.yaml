name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: esplora
          POSTGRES_PASSWORD: esplora
          POSTGRES_DB: esplora_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U esplora"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files are not formatted:"
            echo "$unformatted"
            exit 1
          fi

      - run: go vet ./...

      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest

      - name: Test
        env:
          TEST_DATABASE_URL: postgres://esplora:esplora@127.0.0.1:5432/esplora_test?sslmode=disable
        run: go test -race ./...

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -o drivechain-esplora-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/drivechain-esplora
      - uses: actions/upload-artifact@v4
        with:
          name: drivechain-esplora-${{ matrix.goos }}-${{ matrix.goarch }}
          path: drivechain-esplora-${{ matrix.goos }}-${{ matrix.goarch }}
